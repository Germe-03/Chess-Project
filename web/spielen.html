<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon.png">
<title>Spielen — Schach-Assistent</title>
<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --border:#d8dce2;
    --text:#1c2430; --muted:#5b6675; --primary:#2f6df6; --primary-ink:#ffffff;
    --primary-weak:#e7f0ff; --good:#1f9d57; --warn:#b4690e; --bad:#c23b3b;
    --focus:#1552d6; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.08);
    --sq-light:#efe4cf; --sq-dark:#b48a63; --sq-from:#f6e27a; --sq-to:#8fd18f;
    --marker:rgba(20,30,45,.42); --radius:14px;
  }
  :root[data-theme="dark"]{
    --bg:#12161d; --surface:#1b212b; --surface-2:#222a36; --border:#333d4c;
    --text:#e8ecf2; --muted:#9aa6b6; --primary:#5b8bff; --primary-ink:#0b1220;
    --primary-weak:#1c2942; --good:#4cc281; --warn:#e0a34a; --bad:#e97070;
    --focus:#7aa2ff; --shadow:0 1px 2px rgba(0,0,0,.4);
    --sq-light:#c9ba9c; --sq-dark:#6d5136; --sq-from:#b9a032; --sq-to:#4f9d55;
    --marker:rgba(236,243,255,.5);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#12161d; --surface:#1b212b; --surface-2:#222a36; --border:#333d4c;
      --text:#e8ecf2; --muted:#9aa6b6; --primary:#5b8bff; --primary-ink:#0b1220;
      --primary-weak:#1c2942; --good:#4cc281; --warn:#e0a34a; --bad:#e97070;
      --focus:#7aa2ff; --shadow:0 1px 2px rgba(0,0,0,.4);
      --sq-light:#c9ba9c; --sq-dark:#6d5136; --sq-from:#b9a032; --sq-to:#4f9d55;
      --marker:rgba(236,243,255,.5);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 56px;}
  a{color:var(--primary)}
  h1,h2{line-height:1.2;margin:0}
  .muted{color:var(--muted)}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .brand{margin-right:auto}
  .brand h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .brand p{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .icon-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);
    height:38px;padding:0 12px;border-radius:10px;cursor:pointer}
  .icon-btn:hover{background:var(--surface-2)}

  .grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow)}
  .card h2{font-size:15px;font-weight:700;margin-bottom:4px}
  .card .hint{font-size:13px;color:var(--muted);margin:0 0 14px}

  label.field{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  select{width:100%;height:40px;padding:0 10px;border:1px solid var(--border);border-radius:10px;
    background:var(--surface);color:var(--text);font:inherit}
  .seg{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);
    background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;margin-right:8px;font-size:14px}
  .seg.on{border-color:var(--primary);background:var(--primary-weak)}
  .seg input{accent-color:var(--primary)}
  .btn-primary{background:var(--primary);color:var(--primary-ink);border:none;height:44px;
    padding:0 20px;border-radius:11px;font-weight:600;cursor:pointer;width:100%;margin-top:16px}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);height:40px;
    padding:0 14px;border-radius:10px;cursor:pointer;margin-top:10px;width:100%}
  .btn-ghost:hover{background:var(--surface-2)}
  .btn-ghost:disabled{opacity:.45;cursor:not-allowed}

  .board-wrap{display:flex;gap:10px;align-items:center}
  .ranks{display:grid;grid-template-rows:repeat(8,1fr);font-size:11px;color:var(--muted);
    height:min(76vw,440px);align-items:center}
  .board{width:min(76vw,440px);height:min(76vw,440px);display:grid;
    grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
    border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .files{display:grid;grid-template-columns:repeat(8,1fr);width:min(76vw,440px);
    margin-left:20px;font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
  .sq{display:flex;align-items:center;justify-content:center;font-size:min(9vw,38px);
    line-height:1;position:relative;user-select:none;cursor:pointer}
  .sq.light{background:var(--sq-light)} .sq.dark{background:var(--sq-dark)}
  .sq.from::after,.sq.to::after{content:"";position:absolute;inset:0;opacity:.7}
  .sq.from::after{background:var(--sq-from)}
  .sq.to::after{background:var(--sq-to)}
  .sq .pc{position:relative;z-index:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
  .pc.white{color:#fff} .pc.black{color:#111}
  .sq.sel{box-shadow:inset 0 0 0 4px var(--focus)}
  .sq.target::before,.sq.capture::before{content:"";position:absolute;z-index:0;pointer-events:none}
  .sq.target::before{width:30%;height:30%;border-radius:50%;background:var(--marker)}
  .sq.capture::before{inset:6%;border-radius:50%;border:4px solid var(--marker)}
  .board.locked .sq{cursor:default}

  .status{margin-top:14px;padding:12px 14px;border-radius:11px;background:var(--surface-2);
    border:1px solid var(--border);font-size:14px;display:flex;gap:10px;align-items:center}
  .status.over{background:color-mix(in srgb,var(--good) 14%,transparent);
    border-color:color-mix(in srgb,var(--good) 45%,transparent)}
  .status.error{background:color-mix(in srgb,var(--bad) 12%,transparent);
    border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
  .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--primary);
    border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation-duration:2s}}

  dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:14px 0 0;font-size:13px}
  dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
  .moves{margin-top:14px;max-height:230px;overflow:auto;font-size:13px;
    font-variant-numeric:tabular-nums;border-top:1px solid var(--border);padding-top:10px}
  .moves div{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;padding:2px 0}
  .moves .nr{color:var(--muted)}
  .vinfo{font-size:12px;color:var(--muted);margin-top:6px;min-height:2.4em}
  footer{margin-top:26px;font-size:12px;color:var(--muted);text-align:center}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>♞ Gegen die Engine spielen</h1>
      <p>AI Operations · wähle eine Modellversion und tritt gegen sie an</p>
    </div>
    <a class="icon-btn" href="/" style="text-decoration:none;line-height:38px">← Analyse</a>
    <button class="icon-btn" id="themeToggle" aria-label="Farbschema wechseln">◐ Ansicht</button>
  </header>

  <div class="grid">
    <section class="card">
      <div class="board-wrap">
        <div class="ranks" id="ranks"></div>
        <div class="board" id="board" aria-label="Schachbrett"></div>
      </div>
      <div class="files" id="files"></div>

      <div class="status" id="status" role="status" aria-live="polite">
        <span id="statusText">Wähle eine Version und starte eine Partie.</span>
      </div>
    </section>

    <section class="card">
      <h2>Einstellungen</h2>
      <p class="hint">Gilt ab der nächsten Partie.</p>

      <label class="field" for="version">Modellversion</label>
      <select id="version"></select>
      <div class="vinfo" id="versionInfo"></div>

      <label class="field">Deine Farbe</label>
      <div>
        <label class="seg on"><input type="radio" name="farbe" value="w" checked> Weiss</label>
        <label class="seg"><input type="radio" name="farbe" value="b"> Schwarz</label>
      </div>

      <button class="btn-primary" id="newGame">Neue Partie</button>
      <button class="btn-ghost" id="undo" disabled>Zug zurücknehmen</button>

      <dl class="kv">
        <dt>Engine</dt><dd id="infoEngine">—</dd>
        <dt>Bewertung</dt><dd id="infoEval">—</dd>
        <dt>Vorausschau</dt><dd id="infoTiefe">—</dd>
        <dt>Erwartet</dt><dd id="infoPv">—</dd>
      </dl>

      <div class="moves" id="moves"></div>
    </section>
  </div>

  <footer>Schach-Assistent · FHNW AI Operations</footer>
</div>

<script>
"use strict";
const PIECES = {K:"♔",Q:"♕",R:"♖",B:"♗",N:"♘",P:"♙",k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"};
const NAMES = {k:"König",q:"Dame",r:"Turm",b:"Läufer",n:"Springer",p:"Bauer"};
const START = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
const FILES = ["a","b","c","d","e","f","g","h"];
const $ = s => document.querySelector(s);

/* Der Server hält keine Partie — der ganze Zustand steckt hier im Browser. */
const spiel = {
  fen: START, farbe: "w", version: "", laeuft: false, busy: false,
  verlauf: [], zuege: [], sel: null, ziele: new Set(), from: null, to: null,
};

(function initTheme(){
  try{ const t = localStorage.getItem("sa_theme"); if(t) document.documentElement.setAttribute("data-theme", t); }catch{}
  $("#themeToggle").addEventListener("click", ()=>{
    const cur = document.documentElement.getAttribute("data-theme");
    const dunkel = cur ? cur === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    const next = dunkel ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("sa_theme", next); }catch{}
  });
})();

/* ---------- Brett zeichnen ---------- */
function fenToMap(fen){
  const map = {}, rows = fen.split(/\s+/)[0].split("/");
  for(let r=0;r<8;r++){ let f=0;
    for(const ch of rows[r]){ if(/\d/.test(ch)) f += +ch; else { map[FILES[f]+(8-r)] = ch; f++; } }
  }
  return map;
}
function reihenfolge(){
  const reihen = spiel.farbe === "b" ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
  const linien = spiel.farbe === "b" ? [...FILES].reverse() : FILES;
  return {reihen, linien};
}
function render(){
  const map = fenToMap(spiel.fen);
  const {reihen, linien} = reihenfolge();
  $("#ranks").innerHTML = reihen.map(n=>`<span>${n}</span>`).join("");
  $("#files").innerHTML = linien.map(f=>`<span>${f}</span>`).join("");
  let html = "";
  for(const rank of reihen) for(const file of linien){
    const feld = file + rank;
    const hell = (FILES.indexOf(file) + rank) % 2 === 1;
    const p = map[feld];
    let cls = `sq ${hell ? "light" : "dark"}`;
    if(feld === spiel.from) cls += " from";
    if(feld === spiel.to) cls += " to";
    if(feld === spiel.sel) cls += " sel";
    else if(spiel.ziele.has(feld)) cls += p ? " capture" : " target";
    const figur = p ? `<span class="pc ${p === p.toUpperCase() ? "white" : "black"}">${PIECES[p]}</span>` : "";
    const label = p ? `${feld}, ${p === p.toUpperCase() ? "weisse" : "schwarze"} ${NAMES[p.toLowerCase()]}` : `${feld}, leer`;
    html += `<div class="${cls}" data-square="${feld}" role="button" tabindex="0" aria-label="${label}">${figur}</div>`;
  }
  $("#board").innerHTML = html;
  $("#board").classList.toggle("locked", !spiel.laeuft || spiel.busy);
  $("#undo").disabled = spiel.verlauf.length < 2 || spiel.busy;
}
function setStatus(text, art){
  $("#statusText").textContent = text;
  const el = $("#status");
  el.className = "status" + (art ? " " + art : "");
  el.querySelectorAll(".spinner").forEach(s=>s.remove());
  if(art === "busy") el.insertBefore(Object.assign(document.createElement("span"), {className:"spinner"}), el.firstChild);
}
function zugListe(){
  let html = "";
  for(let i=0;i<spiel.zuege.length;i+=2){
    html += `<div><span class="nr">${i/2+1}.</span><span>${spiel.zuege[i]||""}</span><span>${spiel.zuege[i+1]||""}</span></div>`;
  }
  $("#moves").innerHTML = html;
  $("#moves").scrollTop = $("#moves").scrollHeight;
}

/* ---------- Versionen ---------- */
async function ladeVersionen(){
  try{
    const res = await fetch("/versions");
    const data = await res.json();
    const sel = $("#version");
    sel.innerHTML = data.versions.map(v =>
      `<option value="${v.name}"${v.name === data.active ? " selected" : ""}>${versionsText(v, v.name === data.active)}</option>`
    ).join("");
    spiel.version = sel.value;
    window._versionen = data.versions;
    zeigeVersionInfo();
    sel.addEventListener("change", ()=>{ spiel.version = sel.value; zeigeVersionInfo(); });
  }catch{
    $("#versionInfo").textContent = "Versionen konnten nicht geladen werden — läuft der Server?";
  }
}
function zeigeVersionInfo(){
  const v = (window._versionen||[]).find(x => x.name === $("#version").value);
  $("#versionInfo").textContent = v ? `${v.trained} · ${v.notes}` : "";
}

/* ---------- Spielablauf ---------- */
async function neuePartie(){
  spiel.farbe = document.querySelector('input[name="farbe"]:checked').value;
  spiel.fen = START; spiel.laeuft = true; spiel.zuege = [];
  spiel.verlauf = [START]; spiel.sel = null; spiel.ziele = new Set();
  spiel.from = spiel.to = null;
  $("#infoEngine").textContent = "—"; $("#infoEval").textContent = "—";
  zugListe(); render();
  setStatus(spiel.farbe === "w" ? "Du bist am Zug." : "Die Engine eröffnet …", spiel.farbe === "w" ? "" : "busy");
  if(spiel.farbe === "b") await sendeZug("");
}

async function sendeZug(uci){
  spiel.busy = true; spiel.sel = null; spiel.ziele = new Set(); render();
  if(uci) setStatus("Die Engine überlegt …", "busy");
  try{
    const res = await fetch("/spielen/zug", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({fen: spiel.fen, move: uci, version: spiel.version})
    });
    if(!res.ok){
      const fehler = await res.json().catch(()=>({detail:"Unbekannter Fehler"}));
      setStatus(fehler.detail || "Der Zug wurde abgelehnt.", "error");
      spiel.busy = false; render(); return;
    }
    const d = await res.json();
    spiel.fen = d.fen;
    if(d.player_san) spiel.zuege.push(d.player_san);
    if(d.engine_san) spiel.zuege.push(d.engine_san);
    spiel.verlauf.push(d.fen);
    spiel.from = d.engine_uci ? d.engine_uci.slice(0,2) : null;
    spiel.to   = d.engine_uci ? d.engine_uci.slice(2,4) : null;
    if(d.engine) $("#infoEngine").textContent = d.engine === "rl" ? `RL-Modell ${d.version}` : "Material-Heuristik";
    $("#infoEval").textContent = bewertung(d.evaluation);
    if(d.engine_san){
      const t = d.depth || 1;
      $("#infoTiefe").textContent = t === 1 ? "1 Halbzug" : `${t} Halbzüge`;
      // Erst ab zwei Zügen sagt die Folge mehr als der Zug selbst.
      $("#infoPv").textContent = (d.pv || []).length > 1 ? d.pv.join(" ") : "—";
    }
    if(d.finished){ spiel.laeuft = false; setStatus(d.status, "over"); }
    else setStatus(d.status, "");
    zugListe();
  }catch{
    setStatus("Keine Verbindung zum Server.", "error");
  }
  spiel.busy = false; render();
}

function versionsText(v, aktiv){
  // Eine Version ist Netz plus Suchtiefe; beides gehört in die Auswahl.
  const t = v.search_depth || 1;
  const training = v.episodes ? `${v.episodes} Episoden` : `Netz von ${v.parent}`;
  return `${v.name} · ${t === 1 ? "1 Halbzug" : t + " Halbzüge"} voraus · ${training}${aktiv ? " (aktiv)" : ""}`;
}

function bewertung(v){
  if(v === null || v === undefined || isNaN(+v)) return "—";
  v = +v;
  if(Math.abs(v) <= 1){
    const prozent = Math.round((v + 1) / 2 * 100);
    return `${v >= 0 ? "+" : ""}${v.toFixed(2)} (Weiss ${prozent} %)`;
  }
  return `${(v/100).toFixed(1)} Bauern für ${v >= 0 ? "Weiss" : "Schwarz"}`;
}

async function zeigeZuege(feld){
  if(spiel.sel === feld){ spiel.sel = null; spiel.ziele = new Set(); render(); return; }
  const map = fenToMap(spiel.fen);
  const p = map[feld];
  if(!p) { spiel.sel = null; spiel.ziele = new Set(); render(); return; }
  const istWeiss = p === p.toUpperCase();
  if(istWeiss !== (spiel.farbe === "w")) return;   // nur eigene Figuren
  spiel.sel = feld; spiel.ziele = new Set(); render();
  try{
    const res = await fetch("/legal-moves", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({fen: spiel.fen, square: feld})
    });
    const d = await res.json();
    if(spiel.sel !== feld) return;
    spiel.ziele = new Set(d.targets || []);
    render();
  }catch{ /* ohne Markierung weiterspielen */ }
}

$("#board").addEventListener("click", e=>{
  const sq = e.target.closest(".sq");
  if(!sq || !spiel.laeuft || spiel.busy) return;
  const feld = sq.dataset.square;
  if(spiel.sel && spiel.ziele.has(feld)){ sendeZug(spiel.sel + feld); return; }
  zeigeZuege(feld);
});
$("#board").addEventListener("keydown", e=>{
  if(e.key !== "Enter" && e.key !== " ") return;
  const sq = e.target.closest(".sq"); if(!sq) return;
  e.preventDefault(); sq.click();
});
$("#newGame").addEventListener("click", neuePartie);
$("#undo").addEventListener("click", ()=>{
  if(spiel.verlauf.length < 2 || spiel.busy) return;
  spiel.verlauf.pop();
  spiel.fen = spiel.verlauf[spiel.verlauf.length-1];
  spiel.zuege.splice(-2);
  spiel.sel = null; spiel.ziele = new Set(); spiel.from = spiel.to = null;
  spiel.laeuft = true;
  zugListe(); render(); setStatus("Zug zurückgenommen. Du bist am Zug.", "");
});
document.querySelectorAll('input[name="farbe"]').forEach(r=>r.addEventListener("change", ()=>{
  document.querySelectorAll(".seg").forEach(s=>s.classList.toggle("on", s.querySelector("input").checked));
}));

render();
ladeVersionen();
</script>
</body>
</html>
