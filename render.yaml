# render.com Blueprint — deployt den Schach-Assistenten als Web Service.
# In render.com: New + -> Blueprint -> dieses Repo wählen. Oder manuell einen
# Web Service mit den unten stehenden Build-/Start-Befehlen anlegen.
services:
  - type: web
    name: chess-project
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn Code.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Obergrenze der Vorausschau in Halbzügen. Auf der Free-Instanz (0.1 CPU)
      # dauert ein Zug mit Tiefe 2 rund 1 bis 3 Sekunden, mit Tiefe 3 zu lange.
      - key: MAX_SEARCH_DEPTH
        value: "2"
      # Lagebewertung über das Azure-ML-Modell (POST /lage, Projektaufgabe 2).
      # Der Schlüssel ist geheim: Er wird nur im Render-Dashboard unter
      # Environment gesetzt, nie hier. Ohne ihn ist die Funktion abgeschaltet.
      - key: AZURE_ML_KEY
        sync: false
